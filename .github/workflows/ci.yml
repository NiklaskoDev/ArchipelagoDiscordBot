name: CI

# Lint and test the bot, then build the Docker image once per platform on a runner of that architecture (no emulation)
# and smoke test it. Nothing is pushed here: images are published by release.yml, from a version tag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install, lint, test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff check .
          pytest

  docker:
    name: Build image (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned by commit, not by a tag their owners could move to other code.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ap-discord-bot:smoke
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test the image
        run: |
          docker image inspect --format 'architecture: {{.Architecture}}' ap-discord-bot:smoke
          docker run --rm ap-discord-bot:smoke python -c "import apbot; print(apbot.__version__)"
          # The entrypoint must drop root: Unraid users run the container as 99:100.
          uid="$(docker run --rm -e PUID=99 -e PGID=100 ap-discord-bot:smoke id -u)"
          echo "runs as uid $uid"
          test "$uid" = "99"
