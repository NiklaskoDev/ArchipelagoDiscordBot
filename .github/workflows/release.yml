name: Release

# Runs when a version tag is pushed: vMAJOR.MINOR.HOTFIX or vMAJOR.MINOR.HOTFIX-prN
# Pushing the tag IS the release decision - only the programmer (or the AI on
# explicit instruction) pushes tags. See docs/ai/versioning.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-pr[0-9]+'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        id: tag
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-pr[1-9][0-9]*)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.HOTFIX[-prN]"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-pr* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Optional: fail if the tag does not match the version in your manifest.
      # - name: Check version file
      #   run: test "$(node -p "require('./package.json').version")" = "${{ steps.tag.outputs.version }}"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          touch notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v h="## [$VERSION]" '
              index($0, "## [") == 1 { p = (index($0, h) == 1); next }
              p
            ' CHANGELOG.md > notes.md
          fi

      # Build and publish steps go here (packages, binaries, containers, deploy).
      # Attach files by appending their paths to the `gh release create` command.

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          ARGS=(--verify-tag --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          if grep -q '[^[:space:]]' notes.md; then
            ARGS+=(--notes-file notes.md)
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "$TAG" "${ARGS[@]}"
